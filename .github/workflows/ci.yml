
name: Smart CI - Cache and Dynamic Test Routing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python with cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detect changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/select_tests.py

      - name: Run complete test suite
        if: steps.changes.outputs.run_all == 'true'
        run: python -m pytest -v

      - name: Run selected tests
        if: steps.changes.outputs.run_all != 'true' && steps.changes.outputs.has_tests == 'true'
        env:
          SELECTED_TESTS: ${{ steps.changes.outputs.tests }}
        run: python -m pytest -v $SELECTED_TESTS

      - name: No relevant changes
        if: steps.changes.outputs.run_all != 'true' && steps.changes.outputs.has_tests != 'true'
        run: echo "No relevant changes. Skipping tests."
